<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Codigo Barber</title>
</head>

<body>

    <h1>Codigo Barber</h1>
    
    <p class="slogan">Estilo. Confianza. Actitud.</p>

    <p>Reserva tu cita</p>

    <button>Reservar ahora</button>
    <h2>Reserva tu cita</h2>
    <div class="booking-card">
    
    <label for="firstName">Nombre</label>
    <input type="text" id="firstName" placeholder="Tu nombre">
    
    <label for="lastName">Apellido</label>
    <input type="text" id="lastName" placeholder="Tu apellido">

<select id="service">
    <option value="">Selecciona un servicio</option>
    <option value="basic-haircut">Corte básico</option>
    <option value="detailed-haircut">Corte detallado</option>
    <option value="beard">Barba</option>
</select>

<label for="date">Fecha</label>
<input type="date" id="date">
    
<label for="time">Hora</label>
<input type="time" id="time">
    
<button type="button" id="confirmButton">Confirmar reserva</button>
</div>

<script src="script.js"></script>
</body>
</html>
